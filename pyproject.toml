[project]
name = "pyclicky"
version = "0.1.0"
description = "An asynchronous Python client for the Clicky Analytics API."
readme = "README.md"
license = {text = "Apache-2.0"}

authors = [
    { name = "avclicky", email = "pyclicky@getclicky.com" }
]

requires-python = ">=3.10"

dependencies = [
    "aiohttp>=3.9"
]

keywords = [
    "clicky",
    "analytics",
    "api",
    "asyncio",
    "aiohttp"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
]

[project.urls]
Homepage = "https://github.com/avclicky/pyclicky"
Documentation = "https://github.com/avclicky/pyclicky"
Repository = "https://github.com/avclicky/pyclicky"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
exclude = [".venv", "venv", "build"]
mypy_path = "src"
pretty = true
strict = true
show_error_codes = true
warn_incomplete_stub = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
